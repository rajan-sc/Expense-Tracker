<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container mt-20">
        <div class="glass-card">
            <h1>Add new expense!</h1>
            <form id="expense-form">
                <div>
                    <label for="amount">Amount (in dollars):</label>
                    <input type="number" id="amount" name="amount" placeholder="e.g. 50" required>
                </div>
                <div>
                    <label for="description">Description:</label>
                    <input type="text" id="description" name="description" placeholder="e.g. Groceries" required>
                </div>
                <div>
                    <label for="notes">Notes:</label>
                    <input type="text" id="notes" name="notes" placeholder="Notes (optional)">
                </div>
                <button type="submit" class="btn-primary" id="addExpense-btn" style="margin-top: 20px;">Add Expense</button>
            </form>
        </div>

        <div id="ai-advisor">
            <h3>Financial Advice ✨</h3>
            <p id="ai-insight" style="line-height: 1.5;">Analyzing your expenses...</p>
        </div>

        <div class="flex-between mb-20" style="margin-top: 30px;">
            <h2 id="expheading" style="margin-bottom: 0;">Expenses</h2>
            <div>
                <label for="expense-limit" style="margin-right: 5px;">Rows:</label>
                <select id="expense-limit" style="width: auto; padding: 6px 10px;">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>

        <ul id="expense-list"></ul>
        <div id="pagination-container" style="display: flex; gap: 8px; justify-content: center; margin-top: 20px;"></div>
    </div>

    <div id="floating-widgets" class="floating-widget-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/expense.js"></script>
</body>
</html>
