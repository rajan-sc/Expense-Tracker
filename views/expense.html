<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<body>

    <h1>Add new expense!</h1>
    <form id="expense-form">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" placeholder="Amount" required>
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" placeholder="Description" required>
        <label for="notes">Notes:</label>
        <input type="text" id="notes" name="notes" placeholder="Notes (optional)">
        <button type="submit" id="addExpense-btn">Add Expense</button>
    </form>
    <div id="ai-advisor" style="background-color: #f0f0ff; padding: 10px; border-radius: 8px; margin-bottom: 20px;">
        <h3>Financial Advice:</h3>
        <p id="ai-insight">Analyzing your expenses...</p>
    </div>
    <h2 id="expheading">Expenses</h2>
    <div style="margin-top: 10px; margin-bottom: 10px;">
        <label for="expense-limit">Rows per page: </label>
        <select id="expense-limit">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
        </select>
    </div>
    <ul id="expense-list"></ul>
    <div id="pagination-container" style="display: flex; gap: 5px; margin-top: 10px; align-items: center;"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/expense.js"></script>
</body>
</html>
