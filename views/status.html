<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container mt-20">
        <div class="glass-card text-center" id="status-container">
            <h1 id="status-title">Verifying Payment...</h1>
            <p id="status-message" class="mb-20" style="color: var(--text-muted);">Please wait while we confirm your transaction.</p>
            <button id="home-btn" class="btn-primary" style="display:none;" onclick="window.location.href='/expense'">Back to Dashboard</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/status.js" defer></script>
</body>
</html>
